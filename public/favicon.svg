<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="VoidFetch favicon">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="78%">
      <stop offset="0" stop-color="#171026"/>
      <stop offset="0.55" stop-color="#080815"/>
      <stop offset="1" stop-color="#020207"/>
    </radialGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff5fb"/>
      <stop offset="0.35" stop-color="#ff83bd"/>
      <stop offset="1" stop-color="#f2388f"/>
    </linearGradient>
    <linearGradient id="portal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.45" stop-color="#fb3f9e"/>
      <stop offset="1" stop-color="#59d9ff"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <clipPath id="round"><rect width="512" height="512" rx="106"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- nebula ambience -->
    <ellipse cx="90" cy="345" rx="170" ry="95" fill="#e439a6" opacity="0.12" filter="url(#softGlow)" transform="rotate(-25 90 345)"/>
    <ellipse cx="430" cy="180" rx="150" ry="80" fill="#297cff" opacity="0.12" filter="url(#softGlow)" transform="rotate(28 430 180)"/>

    <!-- stars -->
    <g fill="#fff" opacity="0.9">
      <circle cx="84" cy="105" r="2.5"/><circle cx="139" cy="66" r="1.7"/>
      <circle cx="410" cy="92" r="2.4"/><circle cx="454" cy="149" r="1.6"/>
      <circle cx="56" cy="236" r="1.8"/><circle cx="468" cy="256" r="2.1"/>
      <circle cx="119" cy="412" r="2"/><circle cx="395" cy="418" r="1.7"/>
      <circle cx="225" cy="85" r="1.5"/><circle cx="302" cy="58" r="1.9"/>
    </g>
    <g fill="#ff7bbc" opacity="0.85">
      <circle cx="112" cy="158" r="2.6"/><circle cx="362" cy="126" r="2.1"/>
      <circle cx="432" cy="348" r="2.5"/><circle cx="77" cy="362" r="1.9"/>
    </g>

    <!-- portal glow -->
    <ellipse cx="256" cy="372" rx="152" ry="58" fill="none" stroke="#ff3ca4" stroke-width="28" opacity="0.22" filter="url(#softGlow)"/>
    <ellipse cx="256" cy="372" rx="148" ry="55" fill="none" stroke="url(#portal)" stroke-width="20" filter="url(#glow)"/>
    <ellipse cx="256" cy="374" rx="112" ry="34" fill="#020207"/>
    <ellipse cx="256" cy="364" rx="120" ry="31" fill="none" stroke="#fff" stroke-width="3" opacity="0.28"/>

    <!-- falling data streaks -->
    <g stroke-linecap="round" filter="url(#glow)">
      <path d="M205 72v88" stroke="#8b5cf6" stroke-width="7" opacity="0.65"/>
      <path d="M230 48v108" stroke="#ff55aa" stroke-width="5" opacity="0.85"/>
      <path d="M282 60v94" stroke="#ff55aa" stroke-width="7" opacity="0.8"/>
      <path d="M309 85v74" stroke="#52c7ff" stroke-width="4" opacity="0.7"/>
    </g>

    <!-- download arrow -->
    <g filter="url(#glow)">
      <rect x="223" y="82" width="66" height="176" rx="31" fill="url(#arrow)"/>
      <path d="M149 241h68v-1h78v1h68L256 356Z" fill="url(#arrow)"/>
    </g>
    <path d="M241 100h30" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity="0.42"/>

    <!-- subtle border -->
    <rect x="7" y="7" width="498" height="498" rx="99" fill="none" stroke="#6a5c84" stroke-opacity="0.45" stroke-width="8"/>
  </g>
</svg>